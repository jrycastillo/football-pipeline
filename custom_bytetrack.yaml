# ByteTrack tracker settings for Football Analysis (Maximum Stability - Phase 119)

tracker_type: bytetrack  # tracker type, ['botsort', 'bytetrack']
track_high_thresh: 0.4   # Lowered to catch more detections (was 0.5)
track_low_thresh: 0.1    # threshold for the second association
new_track_thresh: 0.8    # Raised to reduce new track creation (was 0.6)
track_buffer: 240        # 10 second memory for occlusions
match_thresh: 0.6        # Lowered for more lenient matching (was 0.75)
fuse_score: true         # Required for later Ultralytics versions
