# Heuristics & Thresholds - OPTIMIZED FOR M4 PRO
heuristics:
  # Detection - Reduced resolution for M4 Pro speed
  DET_CONF: 0.10
  DET_IOU: 0.50
  DET_IMG_SIZE: 640         # ↓ Reduced from 832 (faster inference)
  VID_STRIDE: 5             # ↓ Process 1 of every 5 frames (good balance)

  # JNR - Less frequent for speed
  JNR_IMG_SIZE: 128         # ↓ Reduced from 160 (faster crops)
  JNR_STRIDE: 20            # ↓ Very infrequent (was 5)
  JNR_GATE: 0.35

  # Tracking
  MAX_TRACK_FRAMES: null
  STORE_IMAGES: 1
  STORE_IMAGES_UP_TO: 1500

  # Stats - Unchanged
  FPS: 25
  MAX_OWNER_PX: 300
  TACKLE_PX: 100
  CHALLENGE_PX: 100
  DRIBBLE_MIN_PX: 25
  OPP_NEAR_PX: 150
  MAX_GAP: 25
  SPEED_PX_THR_FRAC: 0.015
  NEAR_GOAL_FRAC: 0.50
  OPP_THR_PX: 90

  # xG
  XG_DIST_NORM_W: 0.6

  # Goal Detection
  GOAL_MOUTH_WIDTH_FRAC: 0.12
  GOAL_TOP_FRAC: 0.15
  GOAL_BOTTOM_FRAC: 0.85

# Class IDs
classes:
  ball: 0
  goalkeeper: 1
  player: 2
  referee: 3

# M4 Pro Notes:
# - Uses MPS (Metal Performance Shaders) for GPU acceleration
