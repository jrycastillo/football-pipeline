# BoT-SORT settings for Football Analysis (Phase 120)

tracker_type: botsort # tracker type
track_high_thresh: 0.25 # threshold for the first association
track_low_thresh: 0.1 # threshold for the second association
new_track_thresh: 0.25 # threshold for init new track
track_buffer: 240 # INCREASED: buffer for track memory (was 30)
match_thresh: 0.8 # threshold for matching tracks
fuse_score: True # fuse confidence scores with iou

# BoT-SORT specific settings
gmc_method: sparseOptFlow # global motion compensation
proximity_thresh: 0.5 # min IoU for ReID
appearance_thresh: 0.8 # min appearance similarity
with_reid: False # DISABLED: ReID not available without external model
model: auto # uses native features
